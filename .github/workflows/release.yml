name: Release

# Tag-driven desktop release (codex-quota style): push a v* tag and every
# platform job builds its installer with electron-builder, then uploads into
# one GitHub Release. The daemon matrix is cross-compiled by build.mjs inside
# each job, so every artifact carries all bundled binaries.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
      - run: npx --workspace @prism/desktop electron-builder --linux AppImage --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows NSIS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
      # nsis targets are cross-buildable from Linux in electron-builder >= 26.
      - run: npx --workspace @prism/desktop electron-builder --win nsis --x64 --arm64 --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
      - run: npx --workspace @prism/desktop electron-builder --mac dmg --arm64 --x64 --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Compute checksums
        run: |
          cd dist-release
          shopt -s extglob
          for f in *; do
            case "$f" in *.blockmap) rm -f "$f";; esac
          done
          shasum -a 256 * > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist-release/*
