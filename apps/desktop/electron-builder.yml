appId: sh.prism.desktop
productName: Prism
electronVersion: 38.8.6
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/prismd
    to: prismd
  - from: resources/webui
    to: webui
  - from: resources/icon.png
    to: icon.png
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
asarUnpack:
  - "**/node_modules/electron-updater/**"
publish:
  - provider: generic
    url: "https://releases.prism.sh/desktop"
    channel: latest
detectUpdateChannel: false
mac:
  category: Utilities
  notarize: true
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  icon: resources/icon.ico
  forceCodeSigning: true
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Prism
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  icon: resources/icon.png
  category: Utility
  maintainer: Prism Team <team@prism.sh>
  desktop:
    entry:
      Comment: Prism — local-first AI workbench
  executableName: prism-desktop
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - AppImage
