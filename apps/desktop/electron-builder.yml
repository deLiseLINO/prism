appId: sh.prism.desktop
productName: Prism
electronVersion: 38.8.6
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/prismd
    to: prismd
  - from: resources/webui
    to: webui
asarUnpack:
  - "**/node_modules/electron-updater/**"
publish:
  - provider: generic
    url: "https://releases.prism.sh/desktop"
mac:
  target:
    - dmg
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Prism
linux:
  target:
    - AppImage
