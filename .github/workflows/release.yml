name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, matching apps/desktop/package.json (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build everything, publish nothing)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dry_run: ${{ steps.dryrun.outputs.dry_run }}
      ref: ${{ steps.version.outputs.ref }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve dry-run
        id: dryrun
        run: echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
      - name: Resolve version and ref
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          raw="${INPUT_VERSION}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::version '$version' is not semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v${version}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag does not exist; push it before dispatching the workflow"
            exit 1
          fi
          # Pin the exact commit so three parallel build jobs cannot race a
          # force-moved tag into a mixed release.
          sha=$(git rev-parse -q --verify "refs/tags/$tag^{}" || true)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve $tag to a commit"
            exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          # Version equality is checked against the tree the release actually
          # builds (the tag), not the default branch a dispatch checkout lands
          # on: a stale main tree must not approve a version the tag lacks.
          # Beta tags use -beta.N so the GitHub updater can find their channel.
          pkg_version=$(git show "$sha:apps/desktop/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          base_version="${version%%-*}"
          if [ "$base_version" != "$pkg_version" ]; then
            echo "::error::version $version does not equal apps/desktop/package.json $pkg_version at $tag"
            exit 1
          fi
          # The full tag version (with any prerelease suffix) is what gets
          # stamped into artifacts; the base is what package.json must equal.
          echo "full_version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ - ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse to clobber an existing release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # Releases are immutable; a dry run may target an existing release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ steps.dryrun.outputs.dry_run }}" = "true" ]; then
              echo "::notice::release $tag already exists (dry run: continuing)"
            else
              echo "::error::release $tag already exists; refusing to mutate it"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    name: Linux AppImage
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: v${{ needs.preflight.outputs.version }}
      - run: npx --workspace @prism/desktop electron-builder --linux AppImage:x64 AppImage:arm64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-artifacts
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux*.yml
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows NSIS
    needs: preflight
    # nsis cross-built from linux needs wine; the native runner does not.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: v${{ needs.preflight.outputs.version }}
      - run: npx --workspace @prism/desktop electron-builder --win nsis:x64 nsis:arm64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: macOS dmg
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: v${{ needs.preflight.outputs.version }}
      - name: Require macOS update signing identity
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::configure a persistent macOS code-signing identity before building updates"
            exit 1
          fi
      - name: Import macOS update signing identity
        timeout-minutes: 2
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/prism-signing.keychain-db"
          password=$(openssl rand -base64 32)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/prism-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security import "$RUNNER_TEMP/prism-signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/prism-signing.p12" -clcerts -nokeys -passin env:CSC_KEY_PASSWORD -out "$RUNNER_TEMP/prism-signing.pem"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/prism-signing.pem"
          rm "$RUNNER_TEMP/prism-signing.p12" "$RUNNER_TEMP/prism-signing.pem"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: npx --workspace @prism/desktop electron-builder --mac dmg zip --arm64 --x64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - name: Verify signed macOS update packages
        run: |
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          for arch in arm64 x64; do
            if [ "$arch" = arm64 ]; then
              built=apps/desktop/release/mac-arm64/Prism.app
            else
              built=apps/desktop/release/mac/Prism.app
            fi
            zip="apps/desktop/release/Prism-${{ needs.preflight.outputs.full_version }}-${arch}.zip"
            mkdir "$extracted/$arch"
            ditto -x -k "$zip" "$extracted/$arch"
            app="$extracted/$arch/Prism.app"
            requirement=$(codesign -d -r- "$built" 2>&1 | sed -n 's/^designated => //p')
            if [[ "$requirement" != *'certificate leaf'* ]]; then
              echo "::error::macOS identity does not bind updates to the signing certificate"
              exit 1
            fi
            codesign --verify --deep --strict -R="$requirement" "$app"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifacts
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [preflight, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Assemble and verify update feed
        run: |
          node apps/desktop/scripts/assemble-update-feed.mjs dist-release update-feed "${{ needs.preflight.outputs.full_version }}"
          node apps/desktop/scripts/verify-update-feed.mjs update-feed "${{ needs.preflight.outputs.full_version }}" --complete
      - name: Verify and checksum the artifacts users will download
        run: |
          cd dist-release
          found=0
          for f in *; do
            case "$f" in
              *.AppImage|*.exe|*.dmg) found=$((found+1));;
            esac
          done
          if [ "$found" -ne 5 ]; then
            echo "::error::expected 5 installers (2x AppImage, 1x nsis exe, 2x dmg), found $found"
            exit 1
          fi
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS
      - name: Re-check the release does not exist right before publishing
        if: needs.preflight.outputs.dry_run != 'true'
        run: |
          tag="v${{ needs.preflight.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag appeared since preflight; refusing to mutate it"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish (skipped on dry run)
        if: needs.preflight.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            update-feed/*
            dist-release/SHA256SUMS
      - name: Dry run summary
        if: needs.preflight.outputs.dry_run == 'true'
        run: |
          echo "### Release dry run — everything built, nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist-release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  update-homebrew-cask:
    name: Update Homebrew cask
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.preflight.outputs.dry_run != 'true' && !contains(needs.preflight.outputs.version, '-beta.') && needs.publish.result == 'success'
    steps:
      - name: Download checksums and resolve cask data
        id: cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.preflight.outputs.version }}"
          version="${{ needs.preflight.outputs.version }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output SHA256SUMS
          arm_sha=$(awk '$2 == "Prism-'"$version"'-arm64.dmg" {print $1}' SHA256SUMS)
          intel_sha=$(awk '$2 == "Prism-'"$version"'-x64.dmg" {print $1}' SHA256SUMS)
          if [ -z "$arm_sha" ] || [ -z "$intel_sha" ]; then
            echo "::error::missing dmg checksums for $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "arm_sha=$arm_sha"
            echo "intel_sha=$intel_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Update cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is required to publish the cask"
            exit 1
          fi
          version="${{ steps.cask.outputs.version }}"
          arm_sha="${{ steps.cask.outputs.arm_sha }}"
          intel_sha="${{ steps.cask.outputs.intel_sha }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks
          cat > Casks/prism.rb <<'END_CASK'
          cask "prism" do
            arch arm: "arm64", intel: "x64"

            version "VERSION"
            sha256 arm:   "ARM_SHA",
                   intel: "INTEL_SHA"

            url "https://github.com/REPO/releases/download/v#{version}/Prism-#{version}-#{arch}.dmg"
            name "Prism"
            desc "Desktop app for Prism"
            homepage "https://github.com/REPO"

            auto_updates true

            app "Prism.app"
          end
          END_CASK
          sed -i.bak \
            -e "s/VERSION/${version}/" \
            -e "s/ARM_SHA/${arm_sha}/" \
            -e "s/INTEL_SHA/${intel_sha}/" \
            -e "s#REPO#${GITHUB_REPOSITORY}#" \
            Casks/prism.rb
          sed -i.bak 's/^          //' Casks/prism.rb
          rm Casks/prism.rb.bak
          git config user.name "prism-release-bot"
          git config user.email "noreply@prism.sh"
          git add Casks/prism.rb
          if git diff --cached --quiet; then
            echo "::notice::cask already up to date for $version"
            exit 0
          fi
          git commit -m "cask: prism ${version}"
          git push origin main
