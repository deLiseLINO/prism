appId: sh.prism.desktop
productName: Prism
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/prismd
    to: prismd
  - from: resources/webui
    to: webui
asarUnpack:
  - "**/node_modules/electron-updater/**"
publish:
  - provider: generic
    url: "https://releases.prism.sh/desktop"
mac:
  target:
    - dmg
win:
  target:
    - nsis
linux:
  icon: resources/icon.png
  category: Utility
  maintainer: Prism Team <team@prism.sh>
  desktop:
    entry:
      Comment: Prism — local-first AI workbench
  executableName: prism-desktop
  executableArgs:
    - --no-sandbox
  target:
    - AppImage
