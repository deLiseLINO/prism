appId: sh.prism.desktop
productName: Prism
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/prismd
    to: prismd
asarUnpack:
  - "**/node_modules/electron-updater/**"
publish:
  - provider: generic
    url: "https://releases.prism.sh/desktop"
mac:
  target:
    - dmg
win:
  target:
    - nsis
linux:
  target:
    - AppImage
