name: Release

# Desktop release for mac dmg / linux AppImage / windows nsis.
# Practices distilled from several production release pipelines:
# - dry_run defaults to true; the irreversible publish is opt-in
# - preflight refuses an already-published tag/release and validates the
#   version against package.json (prism)
# - minimal top-level permissions; only the publish job escalates (all three)
# - publish gates on every build job result; artifacts are uploaded with
#   if-no-files-found: error
# - SHA256SUMS is computed in the publish job from the downloaded bytes that
#   users will actually get
# - release runs serialize under one concurrency group and are never
#   cancelled mid-flight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release — must equal apps/desktop/package.json (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build everything, publish nothing)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dry_run: ${{ steps.dryrun.outputs.dry_run }}
      ref: ${{ steps.ref.outputs.ref }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # All refs, one refspec: fetch-depth 1 + fetch-tags collides with
          # checkout's own tag refspec on tag-push events (git refuses to
          # fetch two sources into the same refs/tags/* destination).
          fetch-depth: 0
      - name: Resolve dry-run
        id: dryrun
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve version and ref
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="${INPUT_VERSION}"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$version' is not semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v${version}"
          if [ "${{ github.event_name }}" = "push" ]; then
            ref="$tag"
          else
            # Dispatch builds the tag for the requested version, never the
            # moving default branch: a dispatch must publish exactly the
            # audited commit, and the tag must exist.
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag does not exist; push it first (a release publishes a tag, not main HEAD)"
              exit 1
            fi
            ref="$tag"
          fi
          # Pin the exact commit so three parallel build jobs cannot race a
          # force-moved tag into a mixed release.
          sha=$(git rev-parse -q --verify "refs/tags/$tag^{}" || true)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve $tag to a commit"
            exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          # Version equality is checked against the tree the release actually
          # builds (the tag), not the default branch a dispatch checkout lands
          # on: a stale main tree must not approve a version the tag lacks.
          # Prerelease suffixes in the tag (-rc1, -beta.2) are allowed to
          # exceed the package version they build: the package.json bump
          # happens once per x.y.z line, the rc train re-tags the same tree.
          pkg_version=$(git show "$sha:apps/desktop/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          base_version="${version%%-*}"
          if [ "$base_version" != "$pkg_version" ]; then
            echo "::error::version $version does not equal apps/desktop/package.json $pkg_version at $tag"
            exit 1
          fi
          # The full tag version (with any prerelease suffix) is what gets
          # stamped into artifacts; the base is what package.json must equal.
          echo "full_version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ - ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse to clobber an existing release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # A tag push re-releases its own tag by design (releases are
          # immutable, so the guard is about the release, not the tag).
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ steps.dryrun.outputs.dry_run }}" = "true" ]; then
              echo "::notice::release $tag already exists (dry run: continuing)"
            else
              echo "::error::release $tag already exists; refusing to mutate it"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    name: Linux AppImage
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: ${{ github.ref_name }}
      - run: npx --workspace @prism/desktop electron-builder --linux AppImage --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-artifacts
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Windows NSIS
    needs: preflight
    # nsis cross-built from linux needs wine; the native runner does not.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: ${{ github.ref_name }}
      - run: npx --workspace @prism/desktop electron-builder --win nsis --x64 --arm64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS dmg
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: ${{ github.ref_name }}
      - run: npx --workspace @prism/desktop electron-builder --mac dmg --arm64 --x64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifacts
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [preflight, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Verify and checksum the artifacts users will download
        run: |
          cd dist-release
          found=0
          for f in *; do
            case "$f" in
              *.AppImage|*.exe|*.dmg) found=$((found+1));;
            esac
          done
          # AppImage 1 + nsis 1 (x64+arm64 universal installer) + dmg 2.
          if [ "$found" -ne 4 ]; then
            echo "::error::expected 4 installers (AppImage, universal exe, 2x dmg), found $found"
            exit 1
          fi
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS
      - name: Re-check the release does not exist right before publishing
        if: needs.preflight.outputs.dry_run != 'true'
        run: |
          tag="v${{ needs.preflight.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag appeared since preflight; refusing to mutate it"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish (skipped on dry run)
        if: needs.preflight.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*
      - name: Dry run summary
        if: needs.preflight.outputs.dry_run == 'true'
        run: |
          echo "### Release dry run — everything built, nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist-release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
