name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, matching apps/desktop/package.json (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (build everything, publish nothing)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.dry_run == 'true' && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dry_run: ${{ steps.dryrun.outputs.dry_run }}
      ref: ${{ steps.version.outputs.ref }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve dry-run
        id: dryrun
        run: echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
      - name: Resolve version and ref
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          raw="${INPUT_VERSION}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::version '$version' is not semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v${version}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag does not exist; push it before dispatching the workflow"
            exit 1
          fi
          # Pin the exact commit so parallel build jobs cannot race a
          # force-moved tag into a mixed release.
          sha=$(git rev-parse -q --verify "refs/tags/$tag^{}" || true)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve $tag to a commit"
            exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          # Version equality is checked against the tree the release actually
          # builds (the tag), not the default branch a dispatch checkout lands
          # on: a stale main tree must not approve a version the tag lacks.
          # Beta tags use -beta.N so the GitHub updater can find their channel.
          pkg_version=$(git show "$sha:apps/desktop/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          base_version="${version%%-*}"
          if [ "$base_version" != "$pkg_version" ]; then
            echo "::error::version $version does not equal apps/desktop/package.json $pkg_version at $tag"
            exit 1
          fi
          # The full tag version (with any prerelease suffix) is what gets
          # stamped into artifacts; the base is what package.json must equal.
          echo "full_version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ - ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse to clobber an existing release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # Releases are immutable; a dry run may target an existing release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ steps.dryrun.outputs.dry_run }}" = "true" ]; then
              echo "::notice::release $tag already exists (dry run: continuing)"
            else
              echo "::error::release $tag already exists; refusing to mutate it"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    name: Linux AppImage
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: v${{ needs.preflight.outputs.version }}
          PRISM_DAEMON_TARGETS: prism-linux-amd64,prism-linux-arm64,prism-darwin-arm64,prism-darwin-amd64
      - run: npx --workspace @prism/desktop electron-builder --linux AppImage:x64 AppImage:arm64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-artifacts
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux*.yml
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows NSIS
    needs: preflight
    # nsis cross-built from linux needs wine; the native runner does not.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: v${{ needs.preflight.outputs.version }}
          PRISM_DAEMON_TARGETS: prism-windows-amd64.exe,prism-windows-arm64.exe,prism-linux-amd64,prism-linux-arm64
      - run: npx --workspace @prism/desktop electron-builder --win nsis:x64 nsis:arm64 --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache downloaded Electron
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/electron
          key: electron-darwin-${{ matrix.arch }}-38.8.6
      - run: npm ci
      - run: npm run build --workspace @prism/desktop
        env:
          PRISM_RELEASE_TAG: v${{ needs.preflight.outputs.version }}
          PRISM_DAEMON_TARGETS: prism-darwin-arm64,prism-darwin-amd64
      - name: Require macOS update signing identity
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::configure a persistent macOS code-signing identity before building updates"
            exit 1
          fi
      - name: Import macOS update signing identity
        timeout-minutes: 2
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/prism-signing.keychain-db"
          password=$(openssl rand -base64 32)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/prism-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security import "$RUNNER_TEMP/prism-signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/prism-signing.p12" -clcerts -nokeys -passin env:CSC_KEY_PASSWORD -out "$RUNNER_TEMP/prism-signing.pem"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/prism-signing.pem"
          rm "$RUNNER_TEMP/prism-signing.p12" "$RUNNER_TEMP/prism-signing.pem"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: npx --workspace @prism/desktop electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.extraMetadata.version=${{ needs.preflight.outputs.full_version }}
        working-directory: apps/desktop
      - name: Verify signed macOS update package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.preflight.outputs.full_version }}
        run: |
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          if [ "$ARCH" = arm64 ]; then
            built=apps/desktop/release/mac-arm64/Prism.app
          else
            built=apps/desktop/release/mac/Prism.app
          fi
          zip="apps/desktop/release/Prism-${VERSION}-${ARCH}.zip"
          ditto -x -k "$zip" "$extracted"
          app="$extracted/Prism.app"
          requirement=$(codesign -d -r- "$built" 2>&1 | sed -n 's/^designated => //p')
          if [[ "$requirement" != *'certificate leaf'* ]]; then
            echo "::error::macOS identity does not bind updates to the signing certificate"
            exit 1
          fi
          codesign --verify --deep --strict -R="$requirement" "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  build-cli:
    name: CLI archives
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile and archive prism
        env:
          VERSION: ${{ needs.preflight.outputs.full_version }}
        run: |
          set -euo pipefail
          out="$PWD/dist-cli"
          mkdir -p "$out"
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              bin=prism
              if [ "$os" = windows ]; then bin=prism.exe; fi
              stage=$(mktemp -d)
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-X github.com/deLiseLINO/prism/internal/buildinfo.Version=${VERSION}" \
                -o "$stage/$bin" ./cmd/prism
              name="prism_${VERSION}_${os}_${arch}"
              if [ "$os" = windows ]; then
                (cd "$stage" && zip -q "$out/$name.zip" "$bin")
              else
                tar -C "$stage" -czf "$out/$name.tar.gz" "$bin"
              fi
              rm -rf "$stage"
            done
          done
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-artifacts
          path: |
            dist-cli/*.tar.gz
            dist-cli/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [preflight, build-linux, build-windows, build-macos, build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-parts
      - name: Stage release artifacts
        run: |
          mkdir -p dist-release
          cp release-parts/linux-artifacts/* release-parts/windows-artifacts/* dist-release/
          for arch in arm64 x64; do
            cp "release-parts/macos-${arch}-artifacts/"*.dmg "release-parts/macos-${arch}-artifacts/"*.dmg.blockmap dist-release/
            cp "release-parts/macos-${arch}-artifacts/"*.zip "release-parts/macos-${arch}-artifacts/"*.zip.blockmap dist-release/
            cp "release-parts/macos-${arch}-artifacts/latest-mac.yml" "dist-release/latest-mac.yml.${arch}"
          done
          node --input-type=module <<'EOF'
          import { readFile, writeFile, rm } from 'node:fs/promises'
          import { parse, stringify } from 'yaml'
          const parts = []
          for (const arch of ['arm64', 'x64']) {
            parts.push(parse(await readFile(`dist-release/latest-mac.yml.${arch}`, 'utf8')))
            await rm(`dist-release/latest-mac.yml.${arch}`)
          }
          const files = parts.flatMap(info => info.files).filter(file => file.url.endsWith('.zip'))
          if (files.length !== 2) throw new Error(`expected 2 macOS zip entries, got ${files.length}`)
          await writeFile('dist-release/latest-mac.yml', stringify({ ...parts[0], files, path: files[0].url, sha512: files[0].sha512 }))
          EOF
      - name: Assemble and verify update feed
        run: |
          node apps/desktop/scripts/assemble-update-feed.mjs dist-release update-feed "${{ needs.preflight.outputs.full_version }}"
          node apps/desktop/scripts/verify-update-feed.mjs update-feed "${{ needs.preflight.outputs.full_version }}" --complete
      - name: Verify and checksum the artifacts users will download
        run: |
          # Added after the update feed is assembled so the CLI zip archives
          # are not mistaken for macOS update packages.
          cp release-parts/cli-artifacts/* dist-release/
          cd dist-release
          found=0
          for f in *; do
            case "$f" in
              *.AppImage|*.exe|*.dmg) found=$((found+1));;
            esac
          done
          if [ "$found" -ne 5 ]; then
            echo "::error::expected 5 installers (2x AppImage, 1x nsis exe, 2x dmg), found $found"
            exit 1
          fi
          archives=(prism_*.tar.gz prism_*.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "::error::expected 6 CLI archives, found ${#archives[@]}"
            exit 1
          fi
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS
      - name: Re-check the release does not exist right before publishing
        if: needs.preflight.outputs.dry_run != 'true'
        run: |
          tag="v${{ needs.preflight.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag appeared since preflight; refusing to mutate it"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve the previous release tag
        id: previous
        run: |
          current="v${{ needs.preflight.outputs.version }}"
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$'
          if [[ "$current" != *-* ]]; then
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          previous=$(git tag --sort=-v:refname | grep -E "$pattern" | grep -vx "$current" | head -1)
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          echo "previous release tag: ${previous:-none}"
      - name: Publish (skipped on dry run)
        if: needs.preflight.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          draft: ${{ needs.preflight.outputs.prerelease == 'true' }}
          generate_release_notes: true
          previous_tag: ${{ steps.previous.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            update-feed/*
            dist-release/SHA256SUMS
            dist-release/prism_*.tar.gz
            dist-release/prism_*.zip
      - name: Publish the release after its files exist
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.preflight.outputs.version }}"
          id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,assets --jq 'select(.isDraft) | select(any(.assets[]; .name == "rc-mac.yml" or .name == "latest-mac.yml")) | .databaseId')
          if [ -z "$id" ]; then
            echo "release $tag is already public"
            exit 0
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -F draft=false >/dev/null
          echo "published $tag"
      - name: Dry run summary
        if: needs.preflight.outputs.dry_run == 'true'
        run: |
          echo "### Release dry run — everything built, nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist-release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.preflight.outputs.dry_run != 'true' && !contains(needs.preflight.outputs.version, '-beta.') && needs.publish.result == 'success'
    steps:
      - name: Download checksums and resolve package data
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.preflight.outputs.version }}"
          version="${{ needs.preflight.outputs.version }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output SHA256SUMS
          sum_of() {
            awk -v f="$1" '$2 == f {print $1}' SHA256SUMS
          }
          arm_sha=$(sum_of "Prism-${version}-arm64.dmg")
          intel_sha=$(sum_of "Prism-${version}-x64.dmg")
          if [ -z "$arm_sha" ] || [ -z "$intel_sha" ]; then
            echo "::error::missing dmg checksums for $version"
            exit 1
          fi
          darwin_arm64_sha=$(sum_of "prism_${version}_darwin_arm64.tar.gz")
          darwin_amd64_sha=$(sum_of "prism_${version}_darwin_amd64.tar.gz")
          linux_arm64_sha=$(sum_of "prism_${version}_linux_arm64.tar.gz")
          linux_amd64_sha=$(sum_of "prism_${version}_linux_amd64.tar.gz")
          if [ -z "$darwin_arm64_sha" ] || [ -z "$darwin_amd64_sha" ] || [ -z "$linux_arm64_sha" ] || [ -z "$linux_amd64_sha" ]; then
            echo "::error::missing CLI archive checksums for $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "arm_sha=$arm_sha"
            echo "intel_sha=$intel_sha"
            echo "darwin_arm64_sha=$darwin_arm64_sha"
            echo "darwin_amd64_sha=$darwin_amd64_sha"
            echo "linux_arm64_sha=$linux_arm64_sha"
            echo "linux_amd64_sha=$linux_amd64_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Update formula and cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is required to publish the formula and cask"
            exit 1
          fi
          version="${{ steps.pkg.outputs.version }}"
          arm_sha="${{ steps.pkg.outputs.arm_sha }}"
          intel_sha="${{ steps.pkg.outputs.intel_sha }}"
          darwin_arm64_sha="${{ steps.pkg.outputs.darwin_arm64_sha }}"
          darwin_amd64_sha="${{ steps.pkg.outputs.darwin_amd64_sha }}"
          linux_arm64_sha="${{ steps.pkg.outputs.linux_arm64_sha }}"
          linux_amd64_sha="${{ steps.pkg.outputs.linux_amd64_sha }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula Casks
          cat > Formula/prism.rb <<'END_FORMULA'
          class Prism < Formula
            desc "Prism CLI and daemon"
            homepage "https://github.com/@REPO@"
            version "@VERSION@"

            on_macos do
              on_arm do
                url "https://github.com/@REPO@/releases/download/v#{version}/prism_#{version}_darwin_arm64.tar.gz"
                sha256 "@DARWIN_ARM64_SHA@"
              end
              on_intel do
                url "https://github.com/@REPO@/releases/download/v#{version}/prism_#{version}_darwin_amd64.tar.gz"
                sha256 "@DARWIN_AMD64_SHA@"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/@REPO@/releases/download/v#{version}/prism_#{version}_linux_arm64.tar.gz"
                sha256 "@LINUX_ARM64_SHA@"
              end
              on_intel do
                url "https://github.com/@REPO@/releases/download/v#{version}/prism_#{version}_linux_amd64.tar.gz"
                sha256 "@LINUX_AMD64_SHA@"
              end
            end

            def install
              bin.install "prism"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/prism --version")
            end
          end
          END_FORMULA
          cat > Casks/prism-desktop.rb <<'END_CASK'
          cask "prism-desktop" do
            arch arm: "arm64", intel: "x64"

            version "@VERSION@"
            sha256 arm:   "@ARM_SHA@",
                   intel: "@INTEL_SHA@"

            url "https://github.com/@REPO@/releases/download/v#{version}/Prism-#{version}-#{arch}.dmg"
            name "Prism"
            desc "Desktop app for Prism, bundling the prism daemon"
            homepage "https://github.com/@REPO@"

            auto_updates true

            app "Prism.app"
          end
          END_CASK
          sed -i.bak \
            -e "s/@VERSION@/${version}/" \
            -e "s/@ARM_SHA@/${arm_sha}/" \
            -e "s/@INTEL_SHA@/${intel_sha}/" \
            -e "s/@DARWIN_ARM64_SHA@/${darwin_arm64_sha}/" \
            -e "s/@DARWIN_AMD64_SHA@/${darwin_amd64_sha}/" \
            -e "s/@LINUX_ARM64_SHA@/${linux_arm64_sha}/" \
            -e "s/@LINUX_AMD64_SHA@/${linux_amd64_sha}/" \
            -e "s#@REPO@#${GITHUB_REPOSITORY}#g" \
            Formula/prism.rb Casks/prism-desktop.rb
          rm Formula/prism.rb.bak Casks/prism-desktop.rb.bak
          if [ -f Casks/prism.rb ]; then
            git rm -q Casks/prism.rb
          fi
          git config user.name "prism-release-bot"
          git config user.email "noreply@prism.sh"
          git add Formula/prism.rb Casks/prism-desktop.rb
          if git diff --cached --quiet; then
            echo "::notice::formula and cask already up to date for $version"
            exit 0
          fi
          git commit -m "prism ${version}"
          git push origin main
